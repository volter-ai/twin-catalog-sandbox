name: Propose catalog transport repair
on:
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: write
jobs:
  propose:
    runs-on: ubuntu-latest
    steps:
      - name: Open the repair branch for human review
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          case "$GITHUB_REPOSITORY" in
            volter-ai/twin-catalog|volter-ai/twin-catalog-sandbox) ;;
            *) exit 1 ;;
          esac
          cat > /tmp/transport-pr.md <<'BODY'
          The sandbox evaluator retained ready evidence but failed while rereading the PR from GitHub (run 37313751170, attempts 1 and 2), leaving readiness in progress.

          Retry one transport failure for GET requests and report the underlying error code. HTTP refusals and writes are never retried. Current-head readiness and human moderation remain required.

          Validation: all 26 scoped process and packaging tests passed through a disposable World with released runtime 3.0.47 and Bun 1.3.11. This includes recovery after one failed read, repeated transport failure, HTTP refusals, and no replay of POST/PATCH/PUT/DELETE. Actual sandbox provenance and offline Chromium assessment also passed before the reporting failure. The transport repair has fixture verification; real admission must be rerun after merge.
          BODY
          gh pr create --repo "$GITHUB_REPOSITORY" --base main --head catalog/retry-read-transport --title "Retry failed GitHub reads when reporting catalog readiness" --body-file /tmp/transport-pr.md

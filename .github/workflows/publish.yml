name: Publish catalog index
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
  checks: read
  pull-requests: read
  id-token: write
concurrency:
  group: catalog-publication
  cancel-in-progress: false
jobs:
  publish:
    if: vars.CATALOG_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # No candidate imports, installs or tests run in this credentialed job.
      - name: Read admission policy with repository-scoped access
        id: catalog-read
        if: vars.CATALOG_READ_APP_CLIENT_ID != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.CATALOG_READ_APP_CLIENT_ID }}
          private-key: ${{ secrets.CATALOG_READ_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-administration: read
          permission-contents: read
          permission-checks: read
          permission-pull-requests: read
      - name: Verify admission and publish immutable index
        env:
          GH_TOKEN: ${{ github.token }}
          CATALOG_READ_TOKEN: ${{ steps.catalog-read.outputs.token || secrets.CATALOG_READ_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: node bin/twin-catalog.mjs publish --out dist > publication.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catalog-publication-${{ github.run_id }}
          path: publication.json

name: Check default-token settings access
on:
  workflow_dispatch:
permissions:
  contents: read
  checks: read
  pull-requests: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Read branch protection with the default token
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api graphql -f query='query { repository(owner: "volter-ai", name: "twin-catalog-sandbox") { defaultBranchRef { name branchProtectionRule { isAdminEnforced requiresApprovingReviews requiresCodeOwnerReviews requiresLastPushApproval requiredApprovingReviewCount requiresStatusChecks requiresStrictStatusChecks requiredStatusCheckContexts } } } }'
